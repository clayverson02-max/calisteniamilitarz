<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200"><rect x="0" y="0" width="900" height="1200" rx="0" fill="#fff" stroke="none" stroke-width="4"/><rect x="0" y="0" width="900" height="70" rx="0" fill="#143852" stroke="none" stroke-width="4"/><text x="42" y="43" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="white">GUIA VISUAL • ELETRODOMÉSTICOS</text><text x="780" y="43" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#d5ef73">04</text><text x="42" y="112" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#087eae">MICRO-ONDAS</text><text x="42" y="163" font-family="Arial,sans-serif" font-size="39" font-weight="700" fill="#143852">Liga, mas não aquece?</text><text x="42" y="200" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243b4e">Nesta categoria, a consulta do usuário se limita aos controles e à inspeção</text><text x="42" y="228" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243b4e">externa.</text><rect x="42" y="238" width="816" height="325" rx="12" fill="#f0f6f8" stroke="none" stroke-width="4"/><rect x="245" y="287" width="370" height="220" rx="15" fill="white" stroke="#143852" stroke-width="4"/><rect x="263" y="307" width="265" height="180" rx="8" fill="#c6dce5" stroke="#143852" stroke-width="4"/><rect x="539" y="310" width="54" height="50" rx="5" fill="#143852" stroke="none" stroke-width="4"/><path d="M280 455 L510 455" stroke="#087eae" stroke-width="3" fill="none"/><rect x="510" y="360" width="8" height="70" rx="3" fill="#087eae" stroke="none" stroke-width="4"/><circle cx="555" cy="385" r="6" fill="#087eae" stroke="none" stroke-width="5"/><circle cx="580" cy="385" r="6" fill="#087eae" stroke="none" stroke-width="5"/><circle cx="555" cy="411" r="6" fill="#087eae" stroke="none" stroke-width="5"/><circle cx="580" cy="411" r="6" fill="#087eae" stroke="none" stroke-width="5"/><circle cx="555" cy="437" r="6" fill="#087eae" stroke="none" stroke-width="5"/><circle cx="580" cy="437" r="6" fill="#087eae" stroke="none" stroke-width="5"/><path d="M510 385 L660 270" stroke="#087eae" stroke-width="3" fill="none"/><circle cx="680" cy="270" r="19" fill="#087eae" stroke="none" stroke-width="5"/><text x="674" y="277" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="white">1</text><path d="M265 455 L205 490" stroke="#087eae" stroke-width="3" fill="none"/><circle cx="185" cy="490" r="19" fill="#087eae" stroke="none" stroke-width="5"/><text x="179" y="497" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="white">2</text><path d="M566 335 L660 390" stroke="#087eae" stroke-width="3" fill="none"/><circle cx="680" cy="390" r="19" fill="#087eae" stroke="none" stroke-width="5"/><text x="674" y="397" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="white">3</text><circle cx="65" cy="594" r="19" fill="#087eae" stroke="none" stroke-width="5"/><text x="59" y="601" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="white">1</text><text x="94" y="600" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#143852">Porta e fechos</text><circle cx="340" cy="594" r="19" fill="#087eae" stroke="none" stroke-width="5"/><text x="334" y="601" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="white">2</text><text x="369" y="600" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#143852">Cavidade acessível</text><circle cx="615" cy="594" r="19" fill="#087eae" stroke="none" stroke-width="5"/><text x="609" y="601" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="white">3</text><text x="644" y="600" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#143852">Função selecionada</text><rect x="42" y="632" width="816" height="38" rx="5" fill="#087eae" stroke="none" stroke-width="4"/><text x="58" y="658" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="white">ROTEIRO DE OBSERVAÇÃO</text><text x="47" y="700" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#087eae">01</text><text x="105" y="700" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243b4e">Confira se foi selecionado um programa de cozimento, e não apenas a</text><text x="105" y="728" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243b4e">função de temporizador.</text><text x="47" y="782" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#087eae">02</text><text x="105" y="782" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243b4e">Observe a porta sem forçá-la. Dano, desalinhamento, faíscas ou cheiro</text><text x="105" y="810" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243b4e">de queimado exigem interrupção do uso.</text><text x="47" y="864" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#087eae">03</text><text x="105" y="864" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243b4e">Se o comando está correto e o problema persiste, anote o sintoma e</text><text x="105" y="892" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243b4e">encaminhe para assistência.</text><rect x="42" y="942" width="816" height="102" rx="8" fill="#eaf2d2" stroke="none" stroke-width="4"/><text x="58" y="966" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#143852">COMO INTERPRETAR</text><text x="58" y="992" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#243b4e">O painel aceso não prova que o conjunto interno está seguro. Não opere com a porta ou</text><text x="58" y="1020" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#243b4e">as proteções danificadas.</text><rect x="42" y="1061" width="816" height="94" rx="8" fill="#fff0d7" stroke="none" stroke-width="4"/><text x="58" y="1085" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#8e4814">LIMITE DE SEGURANÇA</text><text x="58" y="1112" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#603c22">NUNCA remova a carcaça. Há risco de alta tensão mesmo fora da tomada. Não teste nem</text><text x="58" y="1140" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#603c22">descarregue o capacitor.</text><text x="42" y="1180" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#617785">PÁGINA DEMONSTRATIVA • Esquema conceitual. Consulte o manual do modelo.</text></svg>