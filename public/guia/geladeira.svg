<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200"><rect x="0" y="0" width="900" height="1200" rx="0" fill="#fff" stroke="none" stroke-width="4"/><rect x="0" y="0" width="900" height="70" rx="0" fill="#143852" stroke="none" stroke-width="4"/><text x="42" y="43" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="white">GUIA VISUAL • ELETRODOMÉSTICOS</text><text x="780" y="43" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#d5ef73">02</text><text x="42" y="112" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#087eae">REFRIGERAÇÃO</text><text x="42" y="163" font-family="Arial,sans-serif" font-size="39" font-weight="700" fill="#143852">Não está gelando?</text><text x="42" y="200" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243b4e">Separe ajuste, circulação de ar e vedação antes de suspeitar de uma falha interna.</text><rect x="42" y="238" width="816" height="325" rx="12" fill="#f0f6f8" stroke="none" stroke-width="4"/><rect x="322" y="224" width="215" height="330" rx="13" fill="white" stroke="#143852" stroke-width="4"/><path d="M322 340 L537 340" stroke="#087eae" stroke-width="3" fill="none"/><rect x="505" y="268" width="8" height="40" rx="3" fill="#087eae" stroke="none" stroke-width="4"/><rect x="505" y="370" width="8" height="65" rx="3" fill="#087eae" stroke="none" stroke-width="4"/><rect x="340" y="365" width="135" height="12" rx="2" fill="#b9dce9" stroke="none" stroke-width="4"/><rect x="340" y="421" width="135" height="12" rx="2" fill="#b9dce9" stroke="none" stroke-width="4"/><rect x="340" y="475" width="135" height="35" rx="3" fill="#e3eef4" stroke="none" stroke-width="4"/><path d="M340 371 L205 300" stroke="#087eae" stroke-width="3" fill="none"/><circle cx="185" cy="300" r="19" fill="#087eae" stroke="none" stroke-width="5"/><text x="179" y="307" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="white">1</text><path d="M533 420 L660 420" stroke="#087eae" stroke-width="3" fill="none"/><circle cx="680" cy="420" r="19" fill="#087eae" stroke="none" stroke-width="5"/><text x="674" y="427" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="white">2</text><path d="M420 552 L660 525" stroke="#087eae" stroke-width="3" fill="none"/><circle cx="680" cy="525" r="19" fill="#087eae" stroke="none" stroke-width="5"/><text x="674" y="532" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="white">3</text><circle cx="65" cy="594" r="19" fill="#087eae" stroke="none" stroke-width="5"/><text x="59" y="601" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="white">1</text><text x="94" y="600" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#143852">Circulação de ar</text><circle cx="340" cy="594" r="19" fill="#087eae" stroke="none" stroke-width="5"/><text x="334" y="601" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="white">2</text><text x="369" y="600" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#143852">Vedação da porta</text><circle cx="615" cy="594" r="19" fill="#087eae" stroke="none" stroke-width="5"/><text x="609" y="601" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="white">3</text><text x="644" y="600" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#143852">Ventilação externa</text><rect x="42" y="632" width="816" height="38" rx="5" fill="#087eae" stroke="none" stroke-width="4"/><text x="58" y="658" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="white">ROTEIRO DE OBSERVAÇÃO</text><text x="47" y="700" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#087eae">01</text><text x="105" y="700" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243b4e">Confira o ajuste selecionado e se embalagens estão obstruindo as</text><text x="105" y="728" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243b4e">saídas internas de ar.</text><text x="47" y="782" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#087eae">02</text><text x="105" y="782" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243b4e">Observe se a porta fecha sem obstáculos e se a borracha apresenta</text><text x="105" y="810" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243b4e">sujeira, deformação ou rasgos.</text><text x="47" y="864" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#087eae">03</text><text x="105" y="864" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243b4e">Registre há quanto tempo o problema ocorre, o ambiente de instalação</text><text x="105" y="892" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243b4e">e se houve grande carga de alimentos.</text><rect x="42" y="942" width="816" height="102" rx="8" fill="#eaf2d2" stroke="none" stroke-width="4"/><text x="58" y="966" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#143852">COMO INTERPRETAR</text><text x="58" y="992" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#243b4e">O ruído do compressor, isoladamente, não confirma refrigeração correta. Registre os</text><text x="58" y="1020" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#243b4e">sinais e consulte o manual do modelo.</text><rect x="42" y="1061" width="816" height="94" rx="8" fill="#fff0d7" stroke="none" stroke-width="4"/><text x="58" y="1085" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#8e4814">LIMITE DE SEGURANÇA</text><text x="58" y="1112" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#603c22">Não perfure tubulações, não use objetos para remover gelo e não intervenha no circuito</text><text x="58" y="1140" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#603c22">refrigerante.</text><text x="42" y="1180" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#617785">PÁGINA DEMONSTRATIVA • Esquema conceitual. Consulte o manual do modelo.</text></svg>