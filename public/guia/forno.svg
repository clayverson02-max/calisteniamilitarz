<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200"><rect x="0" y="0" width="900" height="1200" rx="0" fill="#fff" stroke="none" stroke-width="4"/><rect x="0" y="0" width="900" height="70" rx="0" fill="#143852" stroke="none" stroke-width="4"/><text x="42" y="43" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="white">GUIA VISUAL • ELETRODOMÉSTICOS</text><text x="780" y="43" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#d5ef73">03</text><text x="42" y="112" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#087eae">COZINHA ELÉTRICA</text><text x="42" y="163" font-family="Arial,sans-serif" font-size="39" font-weight="700" fill="#143852">Forno não aquece?</text><text x="42" y="200" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243b4e">Uma configuração incorreta pode parecer uma falha de aquecimento. Observe antes de</text><text x="42" y="228" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243b4e">abrir.</text><rect x="42" y="238" width="816" height="325" rx="12" fill="#f0f6f8" stroke="none" stroke-width="4"/><rect x="292" y="263" width="280" height="250" rx="14" fill="white" stroke="#143852" stroke-width="4"/><rect x="312" y="325" width="240" height="165" rx="8" fill="#dcebf1" stroke="#143852" stroke-width="4"/><rect x="326" y="342" width="212" height="13" rx="4" fill="#087eae" stroke="none" stroke-width="4"/><path d="M325 436 L538 436" stroke="#087eae" stroke-width="3" fill="none"/><circle cx="330" cy="290" r="10" fill="#143852" stroke="none" stroke-width="5"/><circle cx="375" cy="290" r="10" fill="#143852" stroke="none" stroke-width="5"/><circle cx="420" cy="290" r="10" fill="#143852" stroke="none" stroke-width="5"/><circle cx="465" cy="290" r="10" fill="#143852" stroke="none" stroke-width="5"/><circle cx="520" cy="290" r="10" fill="#143852" stroke="none" stroke-width="5"/><path d="M330 290 L205 270" stroke="#087eae" stroke-width="3" fill="none"/><circle cx="185" cy="270" r="19" fill="#087eae" stroke="none" stroke-width="5"/><text x="179" y="277" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="white">1</text><path d="M550 370 L660 370" stroke="#087eae" stroke-width="3" fill="none"/><circle cx="680" cy="370" r="19" fill="#087eae" stroke="none" stroke-width="5"/><text x="674" y="377" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="white">2</text><path d="M325 436 L205 460" stroke="#087eae" stroke-width="3" fill="none"/><circle cx="185" cy="460" r="19" fill="#087eae" stroke="none" stroke-width="5"/><text x="179" y="467" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="white">3</text><circle cx="65" cy="594" r="19" fill="#087eae" stroke="none" stroke-width="5"/><text x="59" y="601" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="white">1</text><text x="94" y="600" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#143852">Seletor e timer</text><circle cx="340" cy="594" r="19" fill="#087eae" stroke="none" stroke-width="5"/><text x="334" y="601" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="white">2</text><text x="369" y="600" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#143852">Porta e vedação</text><circle cx="615" cy="594" r="19" fill="#087eae" stroke="none" stroke-width="5"/><text x="609" y="601" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="white">3</text><text x="644" y="600" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#143852">Câmara do forno</text><rect x="42" y="632" width="816" height="38" rx="5" fill="#087eae" stroke="none" stroke-width="4"/><text x="58" y="658" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="white">ROTEIRO DE OBSERVAÇÃO</text><text x="47" y="700" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#087eae">01</text><text x="105" y="700" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243b4e">Anote a função escolhida, a temperatura e o comportamento do timer.</text><text x="105" y="728" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243b4e">Alguns modos não acionam todas as resistências.</text><text x="47" y="782" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#087eae">02</text><text x="105" y="782" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243b4e">Espere esfriar completamente. Observe a porta, a vedação e resíduos,</text><text x="105" y="810" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243b4e">sem remover proteções ou painéis.</text><text x="47" y="864" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#087eae">03</text><text x="105" y="864" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243b4e">Se o sintoma continuar, registre o modelo e o que funciona: luz,</text><text x="105" y="892" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243b4e">ventilação, painel e aquecimento.</text><rect x="42" y="942" width="816" height="102" rx="8" fill="#eaf2d2" stroke="none" stroke-width="4"/><text x="58" y="966" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#143852">COMO INTERPRETAR</text><text x="58" y="992" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#243b4e">Uma resistência aparentemente íntegra pode ter defeito. Uma inspeção visual não</text><text x="58" y="1020" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#243b4e">substitui os testes próprios de assistência.</text><rect x="42" y="1061" width="816" height="94" rx="8" fill="#fff0d7" stroke="none" stroke-width="4"/><text x="58" y="1085" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#8e4814">LIMITE DE SEGURANÇA</text><text x="58" y="1112" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#603c22">Não faça pontes em termostatos ou fusíveis térmicos. Intervenções elétricas internas são</text><text x="58" y="1140" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#603c22">para profissionais habilitados.</text><text x="42" y="1180" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#617785">PÁGINA DEMONSTRATIVA • Esquema conceitual. Consulte o manual do modelo.</text></svg>