<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200"><rect x="0" y="0" width="900" height="1200" rx="0" fill="#fff" stroke="none" stroke-width="4"/><rect x="0" y="0" width="900" height="70" rx="0" fill="#143852" stroke="none" stroke-width="4"/><text x="42" y="43" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="white">GUIA VISUAL • ELETRODOMÉSTICOS</text><text x="780" y="43" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#d5ef73">06</text><text x="42" y="112" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#087eae">BASES DO DIAGNÓSTICO</text><text x="42" y="163" font-family="Arial,sans-serif" font-size="39" font-weight="700" fill="#143852">Conheça o multímetro</text><text x="42" y="200" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243b4e">Exemplo didático em pilha isolada. Não é uma instrução para medir tomadas ou</text><text x="42" y="228" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243b4e">circuitos internos.</text><rect x="42" y="238" width="816" height="325" rx="12" fill="#f0f6f8" stroke="none" stroke-width="4"/><rect x="326" y="240" width="210" height="310" rx="20" fill="#f3ce64" stroke="#143852" stroke-width="4"/><rect x="345" y="265" width="172" height="65" rx="5" fill="#e3eef4" stroke="#143852" stroke-width="4"/><text x="365" y="308" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#143852">1.50 V</text><circle cx="431" cy="407" r="52" fill="#143852" stroke="none" stroke-width="5"/><path d="M431 407 L454 370" stroke="#087eae" stroke-width="3" fill="none"/><circle cx="380" cy="510" r="11" fill="#111" stroke="none" stroke-width="5"/><circle cx="480" cy="510" r="11" fill="#dd5353" stroke="none" stroke-width="5"/><text x="354" y="538" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#243b4e">COM</text><text x="464" y="538" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#243b4e">VΩ</text><path d="M380 510 L275 555" stroke="#087eae" stroke-width="3" fill="none"/><path d="M480 510 L620 555" stroke="#087eae" stroke-width="3" fill="none"/><circle cx="185" cy="290" r="19" fill="#087eae" stroke="none" stroke-width="5"/><text x="179" y="297" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="white">1</text><path d="M205 290 L345 290" stroke="#087eae" stroke-width="3" fill="none"/><circle cx="680" cy="400" r="19" fill="#087eae" stroke="none" stroke-width="5"/><text x="674" y="407" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="white">2</text><path d="M660 400 L484 400" stroke="#087eae" stroke-width="3" fill="none"/><circle cx="680" cy="525" r="19" fill="#087eae" stroke="none" stroke-width="5"/><text x="674" y="532" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="white">3</text><path d="M660 525 L500 525" stroke="#087eae" stroke-width="3" fill="none"/><circle cx="65" cy="594" r="19" fill="#087eae" stroke="none" stroke-width="5"/><text x="59" y="601" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="white">1</text><text x="94" y="600" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#143852">Visor e unidade</text><circle cx="340" cy="594" r="19" fill="#087eae" stroke="none" stroke-width="5"/><text x="334" y="601" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="white">2</text><text x="369" y="600" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#143852">Seletor de função</text><circle cx="615" cy="594" r="19" fill="#087eae" stroke="none" stroke-width="5"/><text x="609" y="601" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="white">3</text><text x="644" y="600" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#143852">Entradas das pontas</text><rect x="42" y="632" width="816" height="38" rx="5" fill="#087eae" stroke="none" stroke-width="4"/><text x="58" y="658" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="white">ROTEIRO DE OBSERVAÇÃO</text><text x="47" y="700" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#087eae">01</text><text x="105" y="700" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243b4e">Leia o manual do instrumento. Confira pontas e isolação; a ponta</text><text x="105" y="728" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243b4e">preta fica em COM e a vermelha na entrada indicada para tensão.</text><text x="47" y="782" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#087eae">02</text><text x="105" y="782" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243b4e">Para uma pilha AA isolada, selecione tensão contínua e uma faixa</text><text x="105" y="810" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243b4e">compatível, conforme o instrumento. Nunca use a entrada de corrente.</text><text x="47" y="864" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#087eae">03</text><text x="105" y="864" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243b4e">Encoste cada ponta em um polo sem uni-los. Observe valor, unidade e</text><text x="105" y="892" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243b4e">polaridade; depois retire as pontas e desligue o medidor.</text><rect x="42" y="942" width="816" height="102" rx="8" fill="#eaf2d2" stroke="none" stroke-width="4"/><text x="58" y="966" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#143852">COMO INTERPRETAR</text><text x="58" y="992" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#243b4e">Tensão medida sem carga não garante que a pilha esteja boa em uso. Continuidade e</text><text x="58" y="1020" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#243b4e">resistência são funções diferentes de tensão.</text><rect x="42" y="1061" width="816" height="94" rx="8" fill="#fff0d7" stroke="none" stroke-width="4"/><text x="58" y="1085" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#8e4814">LIMITE DE SEGURANÇA</text><text x="58" y="1112" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#603c22">Não pratique em rede elétrica. Um aparelho fora da tomada ainda pode armazenar energia</text><text x="58" y="1140" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#603c22">em capacitores.</text><text x="42" y="1180" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#617785">PÁGINA DEMONSTRATIVA • Esquema conceitual. Consulte o manual do modelo.</text></svg>