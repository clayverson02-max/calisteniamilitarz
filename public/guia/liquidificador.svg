<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200"><rect x="0" y="0" width="900" height="1200" rx="0" fill="#fff" stroke="none" stroke-width="4"/><rect x="0" y="0" width="900" height="70" rx="0" fill="#143852" stroke="none" stroke-width="4"/><text x="42" y="43" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="white">GUIA VISUAL • ELETRODOMÉSTICOS</text><text x="780" y="43" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#d5ef73">05</text><text x="42" y="112" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#087eae">PEQUENOS APARELHOS</text><text x="42" y="163" font-family="Arial,sans-serif" font-size="39" font-weight="700" fill="#143852">Vazamento no copo?</text><text x="42" y="200" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243b4e">Localize a origem sem colocar as mãos perto das lâminas e sem molhar a base.</text><rect x="42" y="238" width="816" height="325" rx="12" fill="#f0f6f8" stroke="none" stroke-width="4"/><rect x="335" y="438" width="180" height="103" rx="18" fill="white" stroke="#143852" stroke-width="4"/><path d="M340 265 L510 265 L490 435 L360 435 Z" fill="#dcebf1" stroke="#143852" stroke-width="5"/><rect x="331" y="250" width="188" height="18" rx="5" fill="#087eae" stroke="none" stroke-width="4"/><circle cx="425" cy="488" r="20" fill="#087eae" stroke="none" stroke-width="5"/><path d="M385 400 L465 420" stroke="#087eae" stroke-width="3" fill="none"/><path d="M385 420 L465 400" stroke="#087eae" stroke-width="3" fill="none"/><path d="M510 285 Q580 285 549 380 L499 380" fill="none" stroke="#143852" stroke-width="12"/><path d="M332 259 L205 259" stroke="#087eae" stroke-width="3" fill="none"/><circle cx="185" cy="259" r="19" fill="#087eae" stroke="none" stroke-width="5"/><text x="179" y="266" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="white">1</text><path d="M365 426 L205 425" stroke="#087eae" stroke-width="3" fill="none"/><circle cx="185" cy="425" r="19" fill="#087eae" stroke="none" stroke-width="5"/><text x="179" y="432" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="white">2</text><path d="M510 495 L660 495" stroke="#087eae" stroke-width="3" fill="none"/><circle cx="680" cy="495" r="19" fill="#087eae" stroke="none" stroke-width="5"/><text x="674" y="502" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="white">3</text><circle cx="65" cy="594" r="19" fill="#087eae" stroke="none" stroke-width="5"/><text x="59" y="601" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="white">1</text><text x="94" y="600" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#143852">Tampa e copo</text><circle cx="340" cy="594" r="19" fill="#087eae" stroke="none" stroke-width="5"/><text x="334" y="601" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="white">2</text><text x="369" y="600" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#143852">Conjunto inferior</text><circle cx="615" cy="594" r="19" fill="#087eae" stroke="none" stroke-width="5"/><text x="609" y="601" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="white">3</text><text x="644" y="600" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#143852">Base do motor</text><rect x="42" y="632" width="816" height="38" rx="5" fill="#087eae" stroke="none" stroke-width="4"/><text x="58" y="658" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="white">ROTEIRO DE OBSERVAÇÃO</text><text x="47" y="700" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#087eae">01</text><text x="105" y="700" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243b4e">Retire da tomada. Remova o copo conforme o manual e seque o exterior</text><text x="105" y="728" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243b4e">para localizar o ponto do vazamento.</text><text x="47" y="782" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#087eae">02</text><text x="105" y="782" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243b4e">Observe trincas, tampa e vedação acessível. Só desmonte componentes</text><text x="105" y="810" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243b4e">que o fabricante permite ao usuário retirar.</text><text x="47" y="864" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#087eae">03</text><text x="105" y="864" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243b4e">Se a peça removível estiver danificada, identifique o código correto</text><text x="105" y="892" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243b4e">antes de substituir. Reinstale conforme o manual.</text><rect x="42" y="942" width="816" height="102" rx="8" fill="#eaf2d2" stroke="none" stroke-width="4"/><text x="58" y="966" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#143852">COMO INTERPRETAR</text><text x="58" y="992" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#243b4e">Copo trincado e vedação inadequada não se resolvem apertando indiscriminadamente. Não</text><text x="58" y="1020" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#243b4e">use cola para reparar partes em contato com alimentos.</text><rect x="42" y="1061" width="816" height="94" rx="8" fill="#fff0d7" stroke="none" stroke-width="4"/><text x="58" y="1085" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#8e4814">LIMITE DE SEGURANÇA</text><text x="58" y="1112" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#603c22">Se líquido entrou na base, não religue para testar. Encaminhe para avaliação; não toque</text><text x="58" y="1140" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#603c22">nas lâminas.</text><text x="42" y="1180" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#617785">PÁGINA DEMONSTRATIVA • Esquema conceitual. Consulte o manual do modelo.</text></svg>