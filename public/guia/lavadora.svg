<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200"><rect x="0" y="0" width="900" height="1200" rx="0" fill="#fff" stroke="none" stroke-width="4"/><rect x="0" y="0" width="900" height="70" rx="0" fill="#143852" stroke="none" stroke-width="4"/><text x="42" y="43" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="white">GUIA VISUAL • ELETRODOMÉSTICOS</text><text x="780" y="43" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#d5ef73">01</text><text x="42" y="112" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#087eae">LAVADORAS</text><text x="42" y="163" font-family="Arial,sans-serif" font-size="39" font-weight="700" fill="#143852">Não centrifuga?</text><text x="42" y="200" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243b4e">O sintoma não identifica sozinho a peça com defeito. Comece pelas condições de uso.</text><rect x="42" y="238" width="816" height="325" rx="12" fill="#f0f6f8" stroke="none" stroke-width="4"/><rect x="292" y="240" width="270" height="290" rx="15" fill="white" stroke="#143852" stroke-width="4"/><rect x="308" y="258" width="238" height="48" rx="12" fill="#e3eef4" stroke="none" stroke-width="4"/><circle cx="427" cy="415" r="86" fill="#dcebf1" stroke="#143852" stroke-width="5"/><circle cx="427" cy="415" r="65" fill="#b9dce9" stroke="#087eae" stroke-width="5"/><circle cx="515" cy="280" r="10" fill="#143852" stroke="none" stroke-width="5"/><rect x="325" y="273" width="88" height="16" rx="2" fill="#9db9c7" stroke="none" stroke-width="4"/><path d="M325 280 L205 280" stroke="#087eae" stroke-width="3" fill="none"/><circle cx="185" cy="280" r="19" fill="#087eae" stroke="none" stroke-width="5"/><text x="179" y="287" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="white">1</text><path d="M345 415 L205 415" stroke="#087eae" stroke-width="3" fill="none"/><circle cx="185" cy="415" r="19" fill="#087eae" stroke="none" stroke-width="5"/><text x="179" y="422" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="white">2</text><path d="M555 478 L660 478" stroke="#087eae" stroke-width="3" fill="none"/><circle cx="680" cy="478" r="19" fill="#087eae" stroke="none" stroke-width="5"/><text x="674" y="485" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="white">3</text><circle cx="65" cy="594" r="19" fill="#087eae" stroke="none" stroke-width="5"/><text x="59" y="601" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="white">1</text><text x="94" y="600" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#143852">Painel e programa</text><circle cx="340" cy="594" r="19" fill="#087eae" stroke="none" stroke-width="5"/><text x="334" y="601" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="white">2</text><text x="369" y="600" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#143852">Porta ou tampa</text><circle cx="615" cy="594" r="19" fill="#087eae" stroke="none" stroke-width="5"/><text x="609" y="601" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="white">3</text><text x="644" y="600" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#143852">Saída de água</text><rect x="42" y="632" width="816" height="38" rx="5" fill="#087eae" stroke="none" stroke-width="4"/><text x="58" y="658" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="white">ROTEIRO DE OBSERVAÇÃO</text><text x="47" y="700" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#087eae">01</text><text x="105" y="700" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243b4e">Observe o ciclo: a máquina ainda está drenando ou está em pausa?</text><text x="105" y="728" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243b4e">Anote o código mostrado no painel.</text><text x="47" y="782" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#087eae">02</text><text x="105" y="782" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243b4e">Com o ciclo parado, siga o manual para redistribuir a carga. Não</text><text x="105" y="810" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243b4e">force uma tampa travada.</text><text x="47" y="864" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#087eae">03</text><text x="105" y="864" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243b4e">Com o aparelho desligado, observe apenas o trecho externo da</text><text x="105" y="892" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#243b4e">mangueira: dobras e instalação devem seguir o manual.</text><rect x="42" y="942" width="816" height="102" rx="8" fill="#eaf2d2" stroke="none" stroke-width="4"/><text x="58" y="966" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#143852">COMO INTERPRETAR</text><text x="58" y="992" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#243b4e">Água retida muda o caminho da investigação. Não conclua que o motor ou a placa estão</text><text x="58" y="1020" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#243b4e">danificados só pela falta de centrifugação.</text><rect x="42" y="1061" width="816" height="94" rx="8" fill="#fff0d7" stroke="none" stroke-width="4"/><text x="58" y="1085" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#8e4814">LIMITE DE SEGURANÇA</text><text x="58" y="1112" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#603c22">Não burle a trava da tampa nem acesse partes energizadas. Falha persistente exige</text><text x="58" y="1140" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#603c22">avaliação técnica.</text><text x="42" y="1180" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#617785">PÁGINA DEMONSTRATIVA • Esquema conceitual. Consulte o manual do modelo.</text></svg>